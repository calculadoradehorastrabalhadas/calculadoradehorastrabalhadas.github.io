{{ if not .IsHome }}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="/">Início</a></li>
    {{ if .Section }}
      {{ if eq .Section "glossario" }}
        {{ if ne .RelPermalink "/glossario/" }}<li><a href="/glossario/">Glossário</a></li>{{ end }}
      {{ end }}
    {{ end }}
    {{ if ne .RelPermalink "/glossario/" }}<li aria-current="page">{{ .Title }}</li>{{ end }}
  </ol>
</nav>
{{ end }}
