{{- if and (not .IsHome) (ne .Kind "404") -}}
{{- $items := partial "breadcrumb-items.html" . -}}
<nav class="crumbs" aria-label="Breadcrumb">
  <ol>
  {{- range $i, $e := $items }}
    <li>{{ if eq (add $i 1) (len $items) }}<span aria-current="page">{{ $e.name }}</span>{{ else }}<a href="{{ $e.url }}">{{ $e.name }}</a>{{ end }}</li>
  {{- end }}
  </ol>
</nav>
{{- end -}}
