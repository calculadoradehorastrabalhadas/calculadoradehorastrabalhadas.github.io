baseURL = "https://calculadoradehorastrabalhadas.github.io/"
languageCode = "pt-BR"
defaultContentLanguage = "pt-br"
title = "Calculadora de Horas Trabalhadas"
enableRobotsTXT = false
disableKinds = ["taxonomy", "term"]
enableEmoji = false

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[minify]
  minifyOutput = true

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  homeTitle = "Calculadora de Horas Trabalhadas Online e Grátis"
  description = "Calcule suas horas trabalhadas online e grátis. Informe entrada, saída e intervalo e veja o total diário e semanal na hora, no celular ou no computador."
  author = "Mariana Albuquerque Costa"
  contactEmail = "gp4598049@gmail.com"

[[menus.main]]
  name = "Calculadora"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Glossário"
  url = "/glosario/"
  weight = 2
[[menus.main]]
  name = "Sobre"
  url = "/sobre/"
  weight = 3
[[menus.main]]
  name = "Contato"
  url = "/contato/"
  weight = 4

[[menus.footer]]
  name = "Glossário"
